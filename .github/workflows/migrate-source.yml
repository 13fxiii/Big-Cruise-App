name: Migrate working app source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical repo
        uses: actions/checkout@v4
      - name: Import working app source
        run: |
          rm -rf /tmp/big-cruise-source
          git clone --depth 1 https://github.com/13fxiii/big-cruise-app-7a76c362.git /tmp/big-cruise-source
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/big-cruise-source/ ./
      - name: Commit imported source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'chore: migrate working Big Cruise app source'
          git push origin HEAD:main

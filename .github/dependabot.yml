version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 10
    version-updates: true
    labels:
      - dependencies
      - security
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
